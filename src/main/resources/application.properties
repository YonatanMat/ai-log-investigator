spring.application.name=log-analyzer

# Run this learning project on your own computer.
server.address=127.0.0.1
server.port=8080

# Keep this first API limited to small practice files.
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB

server.error.include-stacktrace=never

# File-backed local history. The mysql profile overrides the datasource.
spring.datasource.url=jdbc:h2:file:./data/log-analyzer;MODE=MySQL
spring.sql.init.mode=always
